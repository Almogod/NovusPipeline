name: NovusPipeline scan
description: Find legacy code, removed/deprecated APIs and standards violations in Python code, and report them in GitHub code scanning.
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: Files or directories to scan (space separated)
    default: "."
  fail-on:
    description: Fail the step if any finding is at least this severe (low, medium, high, critical, never)
    default: never
  upload-sarif:
    description: Upload results to GitHub code scanning (needs `security-events: write`)
    default: "true"
  version:
    description: novuspipeline version specifier, e.g. ==0.2.0 (default latest)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - shell: bash
      run: pip install "novuspipeline${{ inputs.version }}"
    - shell: bash
      run: novuspipeline scan ${{ inputs.path }} --format sarif > novuspipeline.sarif
    - if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: novuspipeline.sarif
        category: novuspipeline
    - shell: bash
      run: novuspipeline scan ${{ inputs.path }} --fail-on ${{ inputs.fail-on }}
