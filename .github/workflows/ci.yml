name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU-only torch (Linux/Windows; avoids multi-GB CUDA wheels)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with the GNN extra
        run: pip install -e ".[gnn]"
      - name: Run tests
        run: python -m unittest discover -s tests -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Smoke-test the built wheel in a clean environment (core install, no torch)
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/novuspipeline --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dependency-audit:
    # Known vulnerabilities in the dependencies a core install resolves to (OSV / PyPI advisories).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip install .
      - run: pip-audit --skip-editable --progress-spinner off

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t novuspipeline:ci .
      - name: Refuses to serve without authentication
        run: |
          if docker run --rm novuspipeline:ci; then
            echo "the container started without authentication" >&2; exit 1
          fi
      - name: Serves with a token; health check and 401 without it
        run: |
          git init -q /tmp/ws
          token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --name novus -p 8000:8000 -v /tmp/ws:/workspace -e NOVUS_AUTH_TOKEN="$token" novuspipeline:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz | grep -q '"auth":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/mcp)" = 401
      - if: failure()
        run: docker logs novus || true
